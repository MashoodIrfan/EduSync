name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: edusync_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      # Row-Level Security is a no-op for the Postgres superuser, so the
      # backend must never connect as `postgres`. This mirrors exactly
      # what docker/postgres-init.sh does for the docker-compose stack.
      - name: Create restricted app role for RLS
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d edusync_db -c "CREATE ROLE edusync_app WITH LOGIN PASSWORD 'edusync_app_password' CREATEDB NOSUPERUSER NOBYPASSRLS;"
          psql -h localhost -U postgres -d edusync_db -c "GRANT ALL PRIVILEGES ON DATABASE edusync_db TO edusync_app;"
          psql -h localhost -U postgres -d edusync_db -c "GRANT ALL PRIVILEGES ON SCHEMA public TO edusync_app;"
          psql -h localhost -U postgres -d edusync_db -c "GRANT CREATE ON SCHEMA public TO edusync_app;"

      - name: Django system check
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-key
          DEBUG: "True"
          POSTGRES_DB: edusync_db
          POSTGRES_USER: edusync_app
          POSTGRES_PASSWORD: edusync_app_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
        run: python manage.py check

      - name: Run backend test suite
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-key
          DEBUG: "True"
          POSTGRES_DB: edusync_db
          POSTGRES_USER: edusync_app
          POSTGRES_PASSWORD: edusync_app_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
        run: python manage.py test

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npx tsc -b

      - name: Production build
        working-directory: frontend
        run: npm run build

  docker-smoke-test:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - uses: actions/checkout@v4

      - name: Use default local/demo env values
        run: cp .env.example .env

      - name: Build and start the full stack
        run: docker compose up --build -d

      - name: Wait for backend to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/admin/login/ > /dev/null; then
              echo "Backend is up."
              exit 0
            fi
            echo "Waiting for backend... ($i)"
            sleep 3
          done
          echo "Backend never became healthy."
          docker compose logs
          exit 1

      - name: Confirm frontend serves the app shell
        run: |
          curl -sf http://localhost:3000 | grep -qi "EduSync" || (echo "Frontend did not return expected content" && exit 1)

      - name: Tear down
        if: always()
        run: docker compose down -v
